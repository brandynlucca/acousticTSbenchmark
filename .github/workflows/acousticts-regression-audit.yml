name: Isolated acousticTS regression audit

on:
  push:
    branches: [diagnostic/acousticts-regression-20261102]

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      OLD_SHA: a61d188a8021a1582f9e685dfaa5dcf3f05285ec
      NEW_SHA: 3b238a837d0ee5e98e2c9142961ab56b47d48a75
    steps:
      - name: Read the pinned package history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: brandynlucca/acousticTS
          ref: 3b238a837d0ee5e98e2c9142961ab56b47d48a75
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated artifacts and compiler settings
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/regression-audit"
          echo "AUDIT_DIR=$RUNNER_TEMP/regression-audit" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 gfortran-13
          printf '%s\n' 'CC=gcc-13' 'CXX=g++-13' 'CXX17=g++-13' 'FC=gfortran-13' 'F77=gfortran-13' > "$RUNNER_TEMP/regression-audit/Makevars"
          echo "R_MAKEVARS_USER=$RUNNER_TEMP/regression-audit/Makevars" >> "$GITHUB_ENV"
          lscpu > "$RUNNER_TEMP/regression-audit/lscpu.txt"
          cat /proc/cpuinfo > "$RUNNER_TEMP/regression-audit/cpuinfo.txt"
          uname -a > "$RUNNER_TEMP/regression-audit/kernel.txt"
          gcc-13 --version > "$RUNNER_TEMP/regression-audit/compiler.txt"
          gfortran-13 --version >> "$RUNNER_TEMP/regression-audit/compiler.txt"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            deps::.
            any::jsonlite

      - name: Build both pinned revisions in separate temporary libraries
        shell: bash
        run: |
          set -euo pipefail
          for revision in old new; do
            if [ "$revision" = old ]; then sha="$OLD_SHA"; else sha="$NEW_SHA"; fi
            mkdir -p "$AUDIT_DIR/$revision-source" "$AUDIT_DIR/$revision-library"
            git archive "$sha" | tar -x -C "$AUDIT_DIR/$revision-source"
            R CMD INSTALL --no-multiarch --no-docs --no-help --no-demo --no-html \
              --library="$AUDIT_DIR/$revision-library" "$AUDIT_DIR/$revision-source" \
              > "$AUDIT_DIR/$revision-build.log" 2>&1
            sha256sum "$AUDIT_DIR/$revision-library/acousticTS/libs/acousticTS.so" \
              > "$AUDIT_DIR/$revision-library.sha256"
          done
          Rscript -e 'writeLines(capture.output(sessionInfo()), file.path(Sys.getenv("AUDIT_DIR"), "R-session.txt"))'

      - name: Compare matched public scalar calls on this runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install psutil==7.2.2
          cat > "$AUDIT_DIR/paired.py" <<'PYTHON'
          import hashlib, itertools, json, os, pathlib, statistics, sys, urllib.request
          work=pathlib.Path(os.environ['AUDIT_DIR'])
          fixture=work/'production-worker'
          source=fixture/'src'
          source.mkdir(parents=True,exist_ok=True)
          ref='df48778195ae94a8da68cfcc820c79abaddda5f0'
          expected={'benchmark.py': 'b1715631c2df1424e815c4cde6e17959261ad437f0c7db9932e0147d276ca6a1', 'process_control.py': '8a15fa80dfef273f0afb4d5cb79e4f3a742e101510b14b4dd4a357d6f599c40e', 'worker_acousticts.R': 'f35ae2b509d4a3510b3b4d4f600a02ca64cddc4affe458ec432ac1e4e46cce51'}
          for name,digest in expected.items():
              with urllib.request.urlopen('https://raw.githubusercontent.com/brandynlucca/acousticTSbenchmark/'+ref+'/src/'+name,timeout=30) as response:
                  value=response.read()
              assert hashlib.sha256(value).hexdigest()==digest,(name,'source hash mismatch')
              (source/name).write_bytes(value)
          worker=source/'worker_acousticts.R'
          value=worker.read_text()
          before='    started <- proc.time()[["elapsed"]]'
          after='    cpu_started <- proc.time()\n'+before
          assert value.count(before)==1
          value=value.replace(before,after)
          before='    answer$elapsed_seconds <- proc.time()[["elapsed"]] - started'
          after=before+'\n    answer$cpu_seconds <- unname(sum((proc.time()-cpu_started)[c("user.self","sys.self")]))'
          assert value.count(before)==1
          worker.write_text(value.replace(before,after))
          sys.path.insert(0,str(source))
          import benchmark
          groups=[(1.001,'liquid'),(1.001,'gas'),(1.01,'liquid'),(1.01,'gas'),
                  (5.,'pressure_release'),(10.,'pressure_release'),
                  (50.,'pressure_release'),(100.,'pressure_release'),(1.01,'rigid')]
          cases=[dict(a=a,ratio=ratio,boundary=boundary,angle=angle,f=f)
                 for a,(ratio,boundary),angle,f in itertools.product(
                     [.001,.01],groups,[0,37,90],[1000,51000,151000,299000])]
          records=[]
          for index,case in enumerate(cases):
              for repetition in range(3):
                  sequence=['old','new'] if (index+repetition)%2==0 else ['new','old']
                  for revision in sequence:
                      print('CASE_START',index+1,len(cases),repetition,revision,json.dumps(case),flush=True)
                      request=dict(software='acousticts',boundary=case['boundary'],frequency_hz=case['f'],
                          incidence_deg=case['angle'],semimajor_m=case['a'],semiminor_m=case['a']/case['ratio'],
                          medium_density_kg_m3=1026.8,medium_sound_speed_m_s=1477.3,
                          target_density_kg_m3=1.24 if case['boundary']=='gas' else 1028.9,
                          target_sound_speed_m_s=345 if case['boundary']=='gas' else 1480.3,
                          controls=dict(precision='quad',adaptive=True,simplify_Amn=False),warmup=True)
                      runtime=dict(env=dict(R_LIBS_USER=str(work/(revision+'-library'))),
                          executables=dict(acousticts=['Rscript','--vanilla']))
                      result=benchmark.measure(request,runtime,work/'one-case',120)
                      record=dict(result,case=case,repetition=repetition,revision=revision,
                          cpu_s=result.get('cpu_seconds'),elapsed_s=result.get('elapsed_seconds'),
                          warmup_s=result.get('warmup_seconds'),real_m=result.get('amplitude_real_m'),
                          imaginary_m=result.get('amplitude_imag_m'))
                      expected_path=str(work/(revision+'-library')/'acousticTS')
                      assert result.get('diagnostics',{}).get('package_path')==expected_path,result
                      records.append(record)
                      with (work/'measurements.jsonl').open('a') as stream:
                          stream.write(json.dumps(record)+'\n')
                      print('CASE_DONE',index+1,repetition,revision,record['status'],record['cpu_s'],record['elapsed_s'],
                          'memory='+str(result.get('memory_status')),flush=True)
          summary=[]
          for case in cases:
              pair=[r for r in records if r['case']==case]
              old=[r for r in pair if r['revision']=='old' and r['status']=='ok']
              new=[r for r in pair if r['revision']=='new' and r['status']=='ok']
              if len(old)!=3 or len(new)!=3:
                  summary.append(dict(case=case,status='incomplete'))
                  continue
              before=statistics.median(r['cpu_s'] for r in old)
              after=statistics.median(r['cpu_s'] for r in new)
              summary.append(dict(case=case,status='ok',old_cpu_s=before,new_cpu_s=after,
                  old_elapsed_s=statistics.median(r['elapsed_s'] for r in old),
                  new_elapsed_s=statistics.median(r['elapsed_s'] for r in new),
                  cpu_ratio_before_after=before/after if after else None,
                  delta_ts_db=new[0]['ts_db']-old[0]['ts_db'],
                  absolute_amplitude_difference_m=abs(complex(new[0]['real_m'],new[0]['imaginary_m'])-
                                                     complex(old[0]['real_m'],old[0]['imaginary_m']))))
          (work/'summary.json').write_text(json.dumps(summary,indent=2))
          (work/'provenance.json').write_text(json.dumps(dict(old_sha=os.environ['OLD_SHA'],new_sha=os.environ['NEW_SHA'],
              github_run_id=os.environ['GITHUB_RUN_ID'],runner_name=os.environ['RUNNER_NAME'],threads=1,
              measurements=len(records),cases=len(cases),precision='quad',adaptive=True,
              production_ref=ref,production_sources=expected,worker_instrumented_sha256=hashlib.sha256(worker.read_bytes()).hexdigest(),
              description='Actual production worker and memory sampler, with CPU timing instrumentation outside the existing elapsed interval. GCC/GFortran 13 matches the saved production build log. Three alternating fresh-process pairs per case. No production publication.'),indent=2))
          PYTHON
          python "$AUDIT_DIR/paired.py"

      - name: Retain diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-acousticts-regression-audit
          path: |
            ${{ runner.temp }}/regression-audit/*.json
            ${{ runner.temp }}/regression-audit/*.jsonl
            ${{ runner.temp }}/regression-audit/*.txt
            ${{ runner.temp }}/regression-audit/*.log
            ${{ runner.temp }}/regression-audit/*.sha256
            ${{ runner.temp }}/regression-audit/*.R
            ${{ runner.temp }}/regression-audit/*.py
            ${{ runner.temp }}/regression-audit/one-case/*.log
            ${{ runner.temp }}/regression-audit/one-case/*.json
            ${{ runner.temp }}/regression-audit/production-worker/src/*
          retention-days: 30
