name: Runner checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Select Rtools45 on Windows
        if: runner.os == 'Windows'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: 4.5.2
          rtools-version: '45'
      - name: Verify common compiler versions and binary128 ABI
        shell: bash
        run: python src/setup_toolchain.py --directory "$RUNNER_TEMP/benchmark-toolchain-check"
      - run: python -m pip install pytest psutil==7.2.2 ijson==3.4.0
      - run: python -m pytest tests -q
      - run: python src/benchmark.py --plan
