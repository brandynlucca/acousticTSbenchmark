      - name: Final data and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
