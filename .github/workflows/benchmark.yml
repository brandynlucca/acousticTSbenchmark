      - name: Prepare bounded timing controller
        if: ${{ inputs.mode != 'prepare' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/benchmark-controller.py" <<'PY'
          """Continue an immutable campaign and publish only between workers."""
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          sys.path.insert(0, str(Path.cwd() / "src"))
          from benchmark import atomic_json, build_cases, load_references, read_json
          from reference_store import join_directory, restore_cache
          from references import export_references

          publisher_spec = importlib.util.spec_from_file_location('dashboard_publisher', os.getenv('BENCHMARK_PUBLISHER', 'src/publish_progress.py'))
          publisher = importlib.util.module_from_spec(publisher_spec)
          publisher_spec.loader.exec_module(publisher)
          GitHub, compact_payload, publish = publisher.GitHub, publisher.compact_payload, publisher.publish
          comparison_rows = publisher.comparison_rows
          safe_error_summary = publisher.safe_error_summary

          def main():
              duration = float(sys.argv[1])
              if duration <= 0:
                  raise ValueError("Controller duration must be positive")
              directory = Path(os.environ["RUNNER_TEMP"]) / "benchmark-results"
              configuration = read_json(os.environ["BENCHMARK_CONFIG"])
              timeout = configuration["case_timeout_seconds"]
              deadline = float(os.environ["BENCHMARK_DEADLINE"])
              stop = time.monotonic() + duration
              next_publish = float("-inf")
              retry_after = float("-inf")
              first_result = True

              def status():
                  path = directory / "status.json"
                  return read_json(path) if path.is_file() else {"recorded": 0}

              def refresh_references():
                  reference_path = os.environ.get("BENCHMARK_REFERENCES")
                  manifest_path = directory / "manifest.json"
                  if not reference_path or not manifest_path.is_file() or not (directory / "results.json").is_file():
                      return
                  jobs = read_json(manifest_path).get("reference_requests", [])
                  previous = read_json(reference_path).get("references", []) if Path(reference_path).is_file() else []
                  if not jobs or len(previous) >= len(jobs):
                      return
                  poll_path = Path(os.environ["RUNNER_TEMP"]) / "reference-poll.json"
                  poll = read_json(poll_path) if poll_path.is_file() else {}
                  if time.time() - poll.get("checked_at", 0) < 120:
                      return
                  poll["checked_at"] = time.time()
                  atomic_json(poll_path, poll)
                  try:
                      api = GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"], timeout_seconds=30)
                      head = api.request("GET", "/git/ref/heads/reference-data")["object"]["sha"]
                      if head == poll.get("head"):
                          return
                      cache = Path(os.environ["RUNNER_TEMP"]) / "reference-cache"
                      restore_cache(api, jobs, cache)
                      records = export_references(jobs, cache, Path(reference_path))["references"]
                      if len(records) > len(previous):
                          join_directory(directory, Path(reference_path))
                          print(f"Updated reference comparisons: {len(records)}/{len(jobs)} qualified", flush=True)
                      poll["head"] = head
                      atomic_json(poll_path, poll)
                  except Exception as error:
                      print(f"Reference refresh deferred ({type(error).__name__})", file=sys.stderr, flush=True)

              def publish_snapshot(*, first=False, force=False):
                  nonlocal next_publish, retry_after
                  now = time.monotonic()
                  if not force and (now < retry_after or (not first and now < next_publish)):
                      return
                  try:
                      refresh_references()
                      result_path = directory / "results.json"
                      rows = read_json(result_path) if result_path.is_file() else [
                          dict(case, status="pending") for case in build_cases(configuration,
                              os.environ["PROFILE"], os.environ["SOFTWARE"].split(","),
                              int(os.environ["REPETITIONS"]))]
                      reference_path = os.environ.get("BENCHMARK_REFERENCES")
                      references = load_references(reference_path) if reference_path and Path(reference_path).is_file() else None
                      rows = comparison_rows(directory, rows, references=references)
                      payload = compact_payload(os.environ["GITHUB_REPOSITORY"],
                          os.environ["BENCHMARK_PLATFORM"], int(os.environ["GITHUB_RUN_ID"]),
                          int(os.environ["GITHUB_RUN_ATTEMPT"]), rows, status(), "running")
                      api = GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"],
                                   timeout_seconds=45)
                      publish(api, payload)
                      print(f"Progress published: {status().get('recorded', 0)} recorded", flush=True)
                      retry_after = float("-inf")
                  except Exception as error:
                      print(f"Progress publication failed ({safe_error_summary(error)}), retrying after one minute",
                            file=sys.stderr, flush=True)
                      retry_after = time.monotonic() + 60
                  next_publish = now + 60

              worker_environment = os.environ.copy()
              for key in ("GITHUB_TOKEN", "GH_TOKEN"):
                  worker_environment.pop(key, None)
              command = [sys.executable, "src/benchmark.py", "--config", os.environ["BENCHMARK_CONFIG"], "--profile", os.environ["PROFILE"],
                  "--software", os.environ["SOFTWARE"], "--repetitions", os.environ["REPETITIONS"],
                  "--runtime", str(Path(os.environ["RUNNER_TEMP"]) / "benchmark-env/runtime.json"),
                  "--output", str(directory), "--budget-seconds", os.environ.get("BENCHMARK_BUDGET_SECONDS", "2700")]
              publish_snapshot(force=True)
              try:
                  while time.monotonic() < stop:
                      before = status()
                      if before.get("state") == "complete" or deadline - time.time() < timeout:
                          break
                      seconds = min(60, max(1, stop - time.monotonic()),
                                    max(1, max(next_publish, retry_after) - time.monotonic()))
                      arguments = command + ["--chunk-seconds", str(seconds)]
                      if first_result:
                          arguments += ["--max-cases", "1"]
                      subprocess.run(arguments, check=True, env=worker_environment)
                      after = status()
                      publish_snapshot(first=first_result)
                      first_result = False
                      if after.get("state") == "complete" or after["recorded"] <= before["recorded"]:
                          break
              finally:
                  publish_snapshot(force=True)

          if __name__ == "__main__":
              main()
          PY
