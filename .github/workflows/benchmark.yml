name: Dense spheroid timings
run-name: ${{ inputs.setup_only && 'Prepare environments' || 'Dense spheroid timings' }} (${{ inputs.platform }})
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Dense gas broadside AR10 pilot or the full case matrix
        type: choice
        options: [pilot, full]
        default: pilot
      platform:
        description: Runner platform
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest, all]
        default: ubuntu-latest
      software:
        description: Comma-separated software identifiers
        type: string
        default: prol_spheroid,acousticts,echosms,liquid_spheroid
      repetitions:
        description: Timed repetitions per physical case
        type: choice
        options: ['1', '3', '5']
        default: '1'
      resume_run_id:
        description: Optional earlier run ID with a matching final artifact
        type: string
        default: ''
      resume_artifact:
        description: Optional checkpoint artifact name instead of the final platform artifact
        type: string
        default: ''
      reference_budget_minutes:
        description: Maximum calculation minutes per reference runner (two parallel runners)
        type: choice
        options: ['15', '30']
        default: '15'
      setup_only:
        description: Prepare and cache software without running timing cases
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: spheroid-timing-campaign
  cancel-in-progress: false
jobs:
  comparisons:
    if: ${{ always() && !inputs.setup_only }}
    needs: [benchmark, references]
    uses: ./.github/workflows/attach-references.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ format('{0}', github.run_id) }}
  references:
    if: ${{ !inputs.setup_only }}
    uses: ./.github/workflows/references.yml
    permissions:
      contents: write
      actions: read
    with:
      profile: ${{ inputs.profile }}
      budget_minutes: ${{ fromJSON(inputs.reference_budget_minutes) }}
  matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.choose.outputs.platforms }}
    steps:
      - id: choose
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python - <<'PY'
          import json, os
          selected = os.environ["PLATFORM"]
          values = ["ubuntu-latest", "windows-latest", "macos-latest"] if selected == "all" else [selected]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("platforms=" + json.dumps(values) + "\n")
          PY
  benchmark:
    name: ${{ inputs.setup_only && 'prepare' || 'benchmark' }} (${{ matrix.os }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    timeout-minutes: ${{ inputs.setup_only && 15 || 60 }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    env:
      PROFILE: ${{ inputs.profile }}
      SOFTWARE: ${{ inputs.software }}
      REPETITIONS: ${{ inputs.repetitions }}
      BENCHMARK_PLATFORM: ${{ matrix.os }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Start campaign deadline
        shell: bash
        run: |
          python - <<'PY'
          import os,time
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BENCHMARK_DEADLINE={time.time()+2700}\n")
              output.write("BENCHMARK_REFERENCES=" + os.path.join(os.environ["RUNNER_TEMP"], "matched-references.json") + "\n")
          PY
      - name: Check timing selection
        shell: bash
        run: python src/benchmark.py --plan --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS"
      - name: Publish setup status
        if: ${{ !inputs.setup_only }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo '[Live progress](https://brandynlucca.github.io/acousticTSbenchmark/)' >> "$GITHUB_STEP_SUMMARY"
          python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state setup
      - name: Restore matching numerical references
        if: ${{ !inputs.setup_only }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/reference_store.py restore --profile "$PROFILE" --cache-dir "$RUNNER_TEMP/reference-cache" --output "$BENCHMARK_REFERENCES"
      - name: Identify R cache platform
        if: contains(inputs.software, 'acousticts')
        id: r-cache-platform
        shell: bash
        run: |
          python - <<'PY'
          import os, platform, re
          if platform.system() == "Linux":
              release = platform.freedesktop_os_release()
              image = release["ID"] + "-" + release["VERSION_ID"]
          else:
              image = os.environ.get("ImageOS", platform.system() + "-" + platform.release())
          image = re.sub(r"[^A-Za-z0-9_.-]", "-", image + "-" + os.environ.get("ImageVersion", "unknown"))
          print("R cache platform:", image, platform.machine(), "image build", os.environ.get("ImageVersion", "unknown"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image={image}\n")
          PY
      - name: Prepare Linux R cache destination
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts')
        shell: bash
        run: sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" /opt/R/4.5.2
      - name: Restore Linux R 4.5.2
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts')
        id: r-runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            /opt/R/4.5.2
            ${{ runner.temp }}/r-runtime-deps/*.deb
          key: r-runtime-v2-${{ steps.r-cache-platform.outputs.image }}-${{ runner.arch }}-4.5.2
      - name: Restore cached R system libraries
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts') && steps.r-runtime-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          packages = sorted((Path(os.environ["RUNNER_TEMP"]) / "r-runtime-deps").glob("*.deb"))
          if packages:
              print(f"Installing {len(packages)} cached system packages without downloads", flush=True)
              command = ["sudo", "env", "DEBIAN_FRONTEND=noninteractive", "dpkg"]
              subprocess.run(command + ["--unpack", *map(str, packages)], check=True, timeout=60)
              subprocess.run(command + ["--configure", "--pending"], check=True, timeout=45)
          PY
      - name: Validate existing Linux R
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts')
        id: r-reuse
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          executable = Path("/opt/R/4.5.2/bin/Rscript")
          usable = False
          if executable.is_file():
              try:
                  result = subprocess.run([str(executable), "--vanilla", "-e",
                      'stopifnot(getRversion() == "4.5.2"); library(stats); cat(R.version.string, "\\n")'],
                      capture_output=True, text=True, timeout=20)
                  print(result.stdout, result.stderr)
                  usable = result.returncode == 0
              except (OSError, subprocess.TimeoutExpired) as error:
                  print("Existing R requires installation:", error)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"usable={str(usable).lower()}\n")
          if usable:
              with open(os.environ["GITHUB_PATH"], "a") as output:
                  output.write(str(executable.parent) + "\n")
          PY
      - name: Install minimal Linux R runtime
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts') && steps.r-reuse.outputs.usable != 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          deadline = time.monotonic() + 270
          release = platform.freedesktop_os_release()
          if release["ID"] != "ubuntu" or platform.machine() != "x86_64":
              raise SystemExit("The minimal R installer requires an Ubuntu x86_64 runner")
          resolver = "https://api.r-hub.io/rversions/resolve/4.5.2/linux-ubuntu-" + release["VERSION_ID"] + "/x86_64"
          with urllib.request.urlopen(resolver, timeout=15) as response:
              resolved = json.load(response)
          url = resolved["url"]
          parsed = urllib.parse.urlparse(url)
          if resolved["version"] != "4.5.2" or parsed.scheme != "https" or parsed.hostname != "cdn.posit.co":
              raise SystemExit("Unexpected R binary resolution")
          print("Installing official R 4.5.2 binary:", url, flush=True)
          archive = Path(os.environ["RUNNER_TEMP"]) / "r-4.5.2.deb"
          def run(command):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("R installation exceeded its deadline")
              subprocess.run(command, check=True, timeout=remaining)
          run(["curl", "--fail", "--location", "--retry", "1", "--connect-timeout", "10",
               "--max-time", "90", "--output", str(archive), url])
          packages = Path(os.environ["RUNNER_TEMP"]) / "r-runtime-deps"
          packages.mkdir(exist_ok=True)
          sources = Path(os.environ["RUNNER_TEMP"]) / "r-runtime-sources.list"
          codename = release["VERSION_CODENAME"]
          sources.write_text(
              f"deb https://archive.ubuntu.com/ubuntu {codename} main universe\n"
              f"deb https://archive.ubuntu.com/ubuntu {codename}-updates main universe\n"
              f"deb https://security.ubuntu.com/ubuntu {codename}-security main universe\n")
          apt = ["sudo", "env", "DEBIAN_FRONTEND=noninteractive", "apt-get",
                 "-o", "Dir::Etc::sourcelist=" + str(sources), "-o", "Dir::Etc::sourceparts=-",
                 "-o", "APT::Get::List-Cleanup=0", "-o", "Dir::Cache::archives=" + str(packages),
                 "-o", "APT::Keep-Downloaded-Packages=true",
                 "-o", "Binary::apt::APT::Keep-Downloaded-Packages=true",
                 "-o", "Acquire::Retries=1", "-o", "Acquire::http::Timeout=20",
                 "-o", "Acquire::https::Timeout=20"]
          run(apt + ["update"])
          run(apt + ["install", "--yes", "--no-install-recommends", str(archive)])
          run(["/opt/R/4.5.2/bin/Rscript", "--vanilla", "-e",
               'stopifnot(getRversion() == "4.5.2"); library(stats); cat(R.version.string, "\\n")'])
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write("/opt/R/4.5.2/bin\n")
          PY
      - name: Set up R 4.5.2 environment
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        if: contains(inputs.software, 'acousticts')
        timeout-minutes: 5
        with:
          r-version: '4.5.2'
          install-r: ${{ runner.os != 'Linux' }}
          use-public-rspm: true
      - name: Verify requested R runtime
        if: contains(inputs.software, 'acousticts')
        timeout-minutes: 1
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() == "4.5.2")
          library(stats)
          cat(R.version.string, "\n")
      - name: Save Linux R immediately
        if: runner.os == 'Linux' && contains(inputs.software, 'acousticts') && steps.r-runtime-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            /opt/R/4.5.2
            ${{ runner.temp }}/r-runtime-deps/*.deb
          key: ${{ steps.r-runtime-cache.outputs.cache-primary-key }}
      - name: Restore R package library
        if: contains(inputs.software, 'acousticts')
        id: r-library-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/benchmark-env/r-library
          key: r-library-v1-${{ steps.r-cache-platform.outputs.image }}-${{ runner.arch }}-4.5.2-${{ hashFiles('src/setup_r.R', 'sources.lock.json', '.github/workflows/benchmark.yml') }}
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        if: contains(inputs.software, 'acousticscattering') || contains(inputs.software, 'liquid_spheroid')
        timeout-minutes: 5
        with:
          version: '1.12.1'
      - name: Reuse installed Linux GCC 14 compilers
        if: runner.os == 'Linux'
        id: compiler-reuse
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil, subprocess
          compilers = {"FC": "gfortran-14", "CC": "gcc-14", "CXX": "g++-14"}
          usable = True
          for variable, compiler in compilers.items():
              executable = shutil.which(compiler)
              if executable is None:
                  print("Compiler unavailable:", compiler)
                  usable = False
                  continue
              try:
                  result = subprocess.run([executable, "-dumpversion"], capture_output=True,
                                          text=True, timeout=10)
                  valid = result.returncode == 0 and result.stdout.strip().split(".")[0] == "14"
                  print(compiler, "version", result.stdout.strip(), "usable", valid)
                  usable = usable and valid
              except (OSError, subprocess.TimeoutExpired) as error:
                  print("Compiler validation failed:", compiler, error)
                  usable = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"usable={str(usable).lower()}\n")
          if usable:
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  for variable, compiler in compilers.items():
                      output.write(f"{variable}={compiler}\nFPM_{variable}={compiler}\n")
          PY
      - uses: fortran-lang/setup-fortran@be037f0a45b1160f139d4ccd0b96f9e9bfd6a682
        if: runner.os != 'Linux' || steps.compiler-reuse.outputs.usable != 'true'
        timeout-minutes: 5
        with:
          compiler: gcc
          version: '14'
      - name: Cache downloaded dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/AppData/Local/pip/Cache
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json', 'src/python-constraints.txt', 'src/setup_julia.jl') }}
      - name: Restore previous checkpoints
        if: inputs.resume_run_id != '' && !inputs.setup_only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.resume_artifact || format('results-{0}', matrix.os) }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/benchmark-results
      - name: Prepare pinned software
        id: prepare
        shell: bash
        env:
          BENCHMARK_R_LIBRARY_CACHE_HIT: ${{ steps.r-library-cache.outputs.cache-hit }}
          SETUP_ONLY: ${{ inputs.setup_only }}
        run: |
          arguments=(src/prepare.py --directory "$RUNNER_TEMP/benchmark-env" --software "$SOFTWARE")
          if [[ "$SETUP_ONLY" == "true" ]]; then
            arguments+=(--validate-workers --validation-timeout-seconds 120)
          fi
          python "${arguments[@]}"
      - name: Check prepared R package library
        if: contains(inputs.software, 'acousticts')
        id: r-library-ready
        shell: bash
        env:
          SETUP_ONLY: ${{ inputs.setup_only }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          runtime = json.loads((Path(os.environ["RUNNER_TEMP"]) / "benchmark-env/runtime.json").read_text())
          ready = (runtime.get("availability", {}).get("acousticts", {}).get("status") == "ready"
                   and (Path(os.environ["RUNNER_TEMP"]) / "benchmark-env/r-packages.json").is_file())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"ready={str(ready).lower()}\n")
          if not ready and os.environ["SETUP_ONLY"] == "true":
              raise SystemExit("acousticTS setup failed. Its package cache will not be saved")
          PY
      - name: Save R packages before benchmarking
        if: steps.r-library-ready.outputs.ready == 'true' && steps.r-library-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/benchmark-env/r-library
          key: ${{ steps.r-library-cache.outputs.cache-primary-key }}
      - name: Benchmark chunk 1
        if: ${{ success() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python src/benchmark.py --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --runtime "$RUNNER_TEMP/benchmark-env/runtime.json" --output "$RUNNER_TEMP/benchmark-results" --budget-seconds 2700 --chunk-seconds 300
      - name: Save checkpoint 1
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ matrix.os }}-${{ github.run_attempt }}-1
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live checkpoint
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state running
      - name: Benchmark chunk 2
        if: ${{ success() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python src/benchmark.py --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --runtime "$RUNNER_TEMP/benchmark-env/runtime.json" --output "$RUNNER_TEMP/benchmark-results" --budget-seconds 2700 --chunk-seconds 300
      - name: Save checkpoint 2
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ matrix.os }}-${{ github.run_attempt }}-2
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live checkpoint
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state running
      - name: Benchmark chunk 3
        if: ${{ success() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python src/benchmark.py --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --runtime "$RUNNER_TEMP/benchmark-env/runtime.json" --output "$RUNNER_TEMP/benchmark-results" --budget-seconds 2700 --chunk-seconds 300
      - name: Save checkpoint 3
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ matrix.os }}-${{ github.run_attempt }}-3
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live checkpoint
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state running
      - name: Benchmark chunk 4
        if: ${{ success() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python src/benchmark.py --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --runtime "$RUNNER_TEMP/benchmark-env/runtime.json" --output "$RUNNER_TEMP/benchmark-results" --budget-seconds 2700 --chunk-seconds 300
      - name: Save checkpoint 4
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ matrix.os }}-${{ github.run_attempt }}-4
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live checkpoint
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state running
      - name: Benchmark chunk 5
        if: ${{ success() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python src/benchmark.py --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --runtime "$RUNNER_TEMP/benchmark-env/runtime.json" --output "$RUNNER_TEMP/benchmark-results" --budget-seconds 2700 --chunk-seconds 300
      - name: Save checkpoint 5
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checkpoint-${{ matrix.os }}-${{ github.run_attempt }}-5
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish live checkpoint
        if: ${{ always() && !inputs.setup_only && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state running
      - name: Final data and logs
        if: ${{ always() && !inputs.setup_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/benchmark-results/manifest.json
            ${{ runner.temp }}/benchmark-results/results.*
            ${{ runner.temp }}/benchmark-results/status.json
            ${{ runner.temp }}/benchmark-results/progress.html
            ${{ runner.temp }}/benchmark-results/records/
            ${{ runner.temp }}/benchmark-results/environments/
            ${{ runner.temp }}/benchmark-results/work/**/worker.log
          if-no-files-found: warn
          retention-days: 90
      - name: Installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: environment-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/benchmark-env/runtime.json
            ${{ runner.temp }}/benchmark-env/validation.json
            ${{ runner.temp }}/benchmark-env/validation/**/worker.log
            ${{ runner.temp }}/benchmark-env/python-freeze.txt
            ${{ runner.temp }}/benchmark-env/r-packages.json
            ${{ runner.temp }}/benchmark-env/julia/Project.toml
            ${{ runner.temp }}/benchmark-env/julia/Manifest.toml
            ${{ runner.temp }}/benchmark-env/julia/LocalPreferences.toml
            ${{ runner.temp }}/benchmark-env/julia-liquid_spheroid/Project.toml
            ${{ runner.temp }}/benchmark-env/julia-liquid_spheroid/Manifest.toml
            ${{ runner.temp }}/benchmark-env/julia-liquid_spheroid/LocalPreferences.toml
          if-no-files-found: warn
          retention-days: 90
      - name: Publish final progress
        if: ${{ always() && !inputs.setup_only }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/publish_progress.py --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state completed
