name: Dense spheroid timings
run-name: ${{ inputs.mode == 'prepare' && format('Prepare environments ({0})', inputs.platform) || inputs.mode == 'extend' && format('Continue {0} after benchmark {1}', inputs.refresh_software, inputs.resume_run_id) || inputs.mode == 'refresh' && format('Refresh {0} from benchmark {1}', inputs.refresh_software, inputs.resume_run_id) || inputs.mode == 'resume' && format('Resume benchmark {0}', inputs.resume_run_id) || format('New {0} benchmark (a={1} m, {2})', inputs.software, inputs.semimajor_m, inputs.platform) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: New, resume, extend selected software, refresh selected software, or prepare
        type: choice
        options: [new, resume, extend, refresh, prepare]
        default: new
      platform:
        description: Platform for new benchmarks or environment preparation
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest, all]
        default: ubuntu-latest
      software:
        description: Software CSV (acousticts, prol_spheroid, echosms, liquid_spheroid)
        type: string
        default: acousticts,prol_spheroid
      frequency_start_khz:
        description: Starting frequency in kHz
        type: string
        default: '1'
      frequency_end_khz:
        description: Ending frequency in kHz (always included)
        type: string
        default: '300'
      frequency_interval_khz:
        description: Frequency interval in kHz
        type: string
        default: '2'
      semimajor_m:
        description: Fixed semimajor axis a in metres (total length is 2a)
        type: choice
        options: ['0.001', '0.01', '0.07', '0.1', '0.5']
        default: '0.07'
      aspect_ratios:
        description: Aspect ratios a/b, comma-separated, each greater than 1
        type: string
        default: '10'
      incidences_deg:
        description: Incidences from the major axis in degrees, e.g. 0,37,90
        type: string
        default: '0,37,90'
      boundaries:
        description: Boundaries CSV (rigid, pressure_release, liquid, gas)
        type: string
        default: rigid,pressure_release,liquid,gas
      case_order:
        description: New-run order (a full sweep holds a, aspect ratio, incidence, and boundary fixed)
        type: choice
        options: ['Complete each frequency sweep', 'Frequency by frequency']
        default: Complete each frequency sweep
      repetitions:
        description: Timed repetitions per physical case
        type: choice
        options: ['1', '3', '5']
        default: '1'
      resume_run_id:
        description: Previous run ID for resume, extend, or refresh
        type: string
        default: ''
      continuation_platform:
        description: Platform for resume, extend, or refresh (other saved results remain available)
        type: choice
        options: ['Keep saved platforms', ubuntu-latest, windows-latest, macos-latest]
        default: Keep saved platforms
      continuation_frequency:
        description: Frequency grid for extend or refresh (other software curves are retained)
        type: choice
        options: ['Keep saved frequency grid', 'Use frequency inputs above']
        default: Keep saved frequency grid
      refresh_software:
        description: Selected software CSV for extend or refresh (other results are retained)
        type: string
        default: acousticts
      resume_artifact:
        description: Optional checkpoint artifact name instead of the final platform artifact
        type: string
        default: ''
      resume_case_order:
        description: Resume order (keeps every saved measurement and solver setting)
        type: choice
        options: ['Keep saved order', 'Complete each frequency sweep', 'Frequency by frequency']
        default: Keep saved order
      reference_budget_minutes:
        description: Reference minutes per runner (0 reuses cached references only)
        type: choice
        options: ['0', '15', '30']
        default: '15'
      timing_budget_minutes:
        description: Minutes per platform, including setup (saved cases can be resumed)
        type: choice
        options: ['45', '120', '240']
        default: '240'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.mode == 'prepare' && format('spheroid-prepare-{0}', inputs.platform) || 'spheroid-timing-campaign' }}
  cancel-in-progress: false
  queue: max
jobs:
  notify-queue:
    if: ${{ always() && inputs.mode != 'prepare' }}
    needs: [matrix, benchmark, references, comparisons]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Wake the saved benchmark queue after results are saved
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          path = f"repos/{os.environ['GH_REPO']}/actions/workflows/queue.yml"
          workflow = json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          if workflow['state'] == 'active':
              subprocess.run(['gh', 'workflow', 'run', 'queue.yml', '--ref', 'main',
                              '-f', 'wait_seconds=120'], check=True)
          else:
              print('Saved benchmark queue is disabled')
          PY
  comparisons:
    if: ${{ always() && inputs.mode != 'prepare' }}
    needs: [benchmark, references]
    uses: ./.github/workflows/attach-references.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ format('{0}', github.run_id) }}
  references:
    if: ${{ inputs.mode != 'prepare' && inputs.reference_budget_minutes != '0' }}
    uses: ./.github/workflows/references.yml
    needs: matrix
    permissions:
      contents: write
      actions: read
    with:
      profile: ${{ needs.matrix.outputs.profile }}
      configuration_json: ${{ needs.matrix.outputs.configuration }}
      source_ref: ${{ needs.matrix.outputs.source_ref }}
      budget_minutes: ${{ fromJSON(inputs.reference_budget_minutes) }}
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      platforms: ${{ steps.choose.outputs.platforms }}
      configuration: ${{ steps.choose.outputs.configuration }}
      profile: ${{ steps.choose.outputs.profile }}
      software: ${{ steps.choose.outputs.software }}
      repetitions: ${{ steps.choose.outputs.repetitions }}
      source_ref: ${{ steps.choose.outputs.source_ref }}
      resume_artifacts: ${{ steps.choose.outputs.resume_artifacts }}
      resume_run_id: ${{ steps.choose.outputs.resume_run_id }}
      resume_case_order: ${{ steps.choose.outputs.resume_case_order }}
      resume_artifact_run_ids: ${{ steps.choose.outputs.resume_artifact_run_ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Resolve and validate campaign
        id: choose
        env:
          CAMPAIGN_INPUTS: ${{ toJSON(inputs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/campaign.py --output "$RUNNER_TEMP/campaign.json"
      - name: Preserve Ubuntu comparison measurements
        if: inputs.mode == 'refresh' || inputs.mode == 'extend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-ubuntu-latest
          path: ${{ runner.temp }}/refresh-baselines/ubuntu-latest/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve Windows comparison measurements
        if: inputs.mode == 'refresh' || inputs.mode == 'extend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-windows-latest
          path: ${{ runner.temp }}/refresh-baselines/windows-latest/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve macOS comparison measurements
        if: inputs.mode == 'refresh' || inputs.mode == 'extend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-macos-latest
          path: ${{ runner.temp }}/refresh-baselines/macos-latest/
          if-no-files-found: warn
          retention-days: 90
  benchmark:
    name: ${{ inputs.mode == 'prepare' && 'prepare' || 'benchmark' }} (${{ matrix.os }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write
    timeout-minutes: ${{ inputs.mode == 'prepare' && 15 || 270 }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    env:
      PROFILE: ${{ needs.matrix.outputs.profile }}
      SOFTWARE: ${{ needs.matrix.outputs.software }}
      REPETITIONS: ${{ needs.matrix.outputs.repetitions }}
      BENCHMARK_PLATFORM: ${{ matrix.os }}
      BENCHMARK_PUBLISHER: src/publish_progress.py
      TIMING_BUDGET_MINUTES: ${{ inputs.timing_budget_minutes }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Start campaign deadline
        shell: bash
        run: |
          python - <<'PY'
          import os,time
          budget = int(os.environ['TIMING_BUDGET_MINUTES'])
          if budget not in (45, 120, 240):
              raise SystemExit('Timing budget must be 45, 120, or 240 minutes per platform')
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"BENCHMARK_DEADLINE={time.time()+60*budget}\n")
              output.write(f"BENCHMARK_BUDGET_SECONDS={60*budget}\n")
              output.write("BENCHMARK_REFERENCES=" + os.path.join(os.environ["RUNNER_TEMP"], "matched-references.json") + "\n")
          PY
      - name: Restore previous checkpoints
        if: ${{ (inputs.mode == 'resume' || inputs.mode == 'refresh' || inputs.mode == 'extend') && fromJSON(needs.matrix.outputs.resume_artifacts)[matrix.os] != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ fromJSON(needs.matrix.outputs.resume_artifacts)[matrix.os] }}
          run-id: ${{ fromJSON(needs.matrix.outputs.resume_artifact_run_ids)[matrix.os] }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/benchmark-results
      - name: Check out current workflow controllers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preserve controllers for source-pinned resumes
        shell: bash
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, variable in [('setup_macos.py', 'MACOS_SETUP_SCRIPT'), ('resume_order.py', 'RESUME_ORDER_SCRIPT')]:
                  target = Path(os.environ['RUNNER_TEMP']) / name
                  shutil.copyfile(Path('src') / name, target)
                  output.write(f'{variable}={target}\n')
              publisher = Path(os.environ['RUNNER_TEMP']) / 'dashboard_publisher.py'
              bootstrap = "import sys\nfrom pathlib import Path\nsys.path.insert(0, str(Path.cwd() / 'src'))\n"
              publisher.write_text(bootstrap + Path('src/publish_progress.py').read_text(encoding='utf-8'), encoding='utf-8')
              output.write(f'BENCHMARK_PUBLISHER={publisher}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.matrix.outputs.source_ref }}
      - name: Write resolved campaign configuration
        shell: bash
        env:
          CONFIGURATION_JSON: ${{ needs.matrix.outputs.configuration }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "benchmark-config.json"
          path.write_text(json.dumps(json.loads(os.environ["CONFIGURATION_JSON"]), indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BENCHMARK_CONFIG={path}\n")
          PY
      - name: Apply selected resume order
        if: ${{ inputs.mode == 'resume' && needs.matrix.outputs.resume_case_order != '' }}
        shell: bash
        env:
          RESUME_CASE_ORDER: ${{ needs.matrix.outputs.resume_case_order }}
        run: |
          python "$RESUME_ORDER_SCRIPT" --directory "$RUNNER_TEMP/benchmark-results" --config "$BENCHMARK_CONFIG" \
            --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS" --order "$RESUME_CASE_ORDER"
      - name: Install memory observer
        shell: bash
        run: python -m pip install psutil==7.2.2
      - name: Record benchmark source provenance
        if: ${{ inputs.mode != 'prepare' }}
        shell: bash
        env:
          SOURCE_REF: ${{ needs.matrix.outputs.source_ref }}
          RESUME_RUN_ID: ${{ needs.matrix.outputs.resume_run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if revision != os.environ["SOURCE_REF"]:
              raise SystemExit("Checked-out source does not match continuation provenance")
          directory = Path(os.environ["RUNNER_TEMP"]) / "benchmark-results"
          directory.mkdir(parents=True, exist_ok=True)
          source = dict(schema_version=1, repository=os.environ["GITHUB_REPOSITORY"], source_ref=revision,
                        workflow_ref=os.environ["GITHUB_WORKFLOW_REF"], workflow_sha=os.environ["GITHUB_SHA"],
                        run_id=int(os.environ["GITHUB_RUN_ID"]),
                        resumed_from_run_id=int(os.environ["RESUME_RUN_ID"]) if os.environ["RESUME_RUN_ID"] else None)
          refresh_path = directory / "refresh-campaign.json"
          if refresh_path.is_file() and not (directory / "manifest.json").is_file():
              refresh = json.loads(refresh_path.read_text(encoding="utf-8"))
              if refresh["settings"]["source_ref"] != revision:
                  raise SystemExit("Refresh baseline source does not match the checked-out source")
              refresh.setdefault("baseline_origin_run_id", refresh["run_id"])
              refresh["previous_baseline_run_id"] = refresh["run_id"]
              refresh.update(run_id=source["run_id"], resumed_from_run_id=source["resumed_from_run_id"])
              temporary = refresh_path.with_suffix(".json.tmp")
              temporary.write_text(json.dumps(refresh, indent=2) + "\n", encoding="utf-8")
              temporary.replace(refresh_path)
          (directory / "benchmark-source.json").write_text(json.dumps(source, indent=2) + "\n")
          PY
      - name: Check timing selection
        shell: bash
        run: python src/benchmark.py --plan --config "$BENCHMARK_CONFIG" --profile "$PROFILE" --software "$SOFTWARE" --repetitions "$REPETITIONS"
      - name: Publish setup status
        if: ${{ inputs.mode != 'prepare' }}
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo '[Live progress](https://brandynlucca.github.io/acousticTSbenchmark/)' >> "$GITHUB_STEP_SUMMARY"
          python "$BENCHMARK_PUBLISHER" --config "$BENCHMARK_CONFIG" --repository "$GITHUB_REPOSITORY" --directory "$RUNNER_TEMP/benchmark-results" --platform "$BENCHMARK_PLATFORM" --state setup
      - name: Restore matching numerical references
        if: ${{ inputs.mode != 'prepare' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/reference_store.py restore --config "$BENCHMARK_CONFIG" --profile "$PROFILE" --cache-dir "$RUNNER_TEMP/reference-cache" --output "$BENCHMARK_REFERENCES"
      - name: Identify R cache platform
        if: contains(env.SOFTWARE, 'acousticts')
        id: r-cache-platform
        shell: bash
        run: |
          python - <<'PY'
          import os, platform, re
          if platform.system() == "Linux":
              release = platform.freedesktop_os_release()
              image = release["ID"] + "-" + release["VERSION_ID"]
          else:
              image = os.environ.get("ImageOS", platform.system() + "-" + platform.release())
          image = re.sub(r"[^A-Za-z0-9_.-]", "-", image + "-" + os.environ.get("ImageVersion", "unknown"))
          print("R cache platform:", image, platform.machine(), "image build", os.environ.get("ImageVersion", "unknown"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image={image}\n")
          PY
      - name: Prepare Linux R cache destination
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts')
        shell: bash
        run: sudo install -d -m 755 -o "$(id -u)" -g "$(id -g)" /opt/R/4.5.2
      - name: Restore Linux R 4.5.2
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts')
        id: r-runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            /opt/R/4.5.2
            ${{ runner.temp }}/r-runtime-deps/*.deb
          key: r-runtime-v2-${{ steps.r-cache-platform.outputs.image }}-${{ runner.arch }}-4.5.2
      - name: Restore cached R system libraries
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts') && steps.r-runtime-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          packages = sorted((Path(os.environ["RUNNER_TEMP"]) / "r-runtime-deps").glob("*.deb"))
          if packages:
              print(f"Installing {len(packages)} cached system packages without downloads", flush=True)
              command = ["sudo", "env", "DEBIAN_FRONTEND=noninteractive", "dpkg"]
              subprocess.run(command + ["--unpack", *map(str, packages)], check=True, timeout=60)
              subprocess.run(command + ["--configure", "--pending"], check=True, timeout=45)
          PY
      - name: Validate existing Linux R
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts')
        id: r-reuse
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          executable = Path("/opt/R/4.5.2/bin/Rscript")
          usable = False
          if executable.is_file():
              try:
                  result = subprocess.run([str(executable), "--vanilla", "-e",
                      'stopifnot(getRversion() == "4.5.2"); library(stats); cat(R.version.string, "\\n")'],
                      capture_output=True, text=True, timeout=20)
                  print(result.stdout, result.stderr)
                  usable = result.returncode == 0
              except (OSError, subprocess.TimeoutExpired) as error:
                  print("Existing R requires installation:", error)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"usable={str(usable).lower()}\n")
          if usable:
              with open(os.environ["GITHUB_PATH"], "a") as output:
                  output.write(str(executable.parent) + "\n")
          PY
      - name: Install minimal Linux R runtime
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts') && steps.r-reuse.outputs.usable != 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          deadline = time.monotonic() + 270
          release = platform.freedesktop_os_release()
          if release["ID"] != "ubuntu" or platform.machine() != "x86_64":
              raise SystemExit("The minimal R installer requires an Ubuntu x86_64 runner")
          resolver = "https://api.r-hub.io/rversions/resolve/4.5.2/linux-ubuntu-" + release["VERSION_ID"] + "/x86_64"
          with urllib.request.urlopen(resolver, timeout=15) as response:
              resolved = json.load(response)
          url = resolved["url"]
          parsed = urllib.parse.urlparse(url)
          if resolved["version"] != "4.5.2" or parsed.scheme != "https" or parsed.hostname != "cdn.posit.co":
              raise SystemExit("Unexpected R binary resolution")
          print("Installing official R 4.5.2 binary:", url, flush=True)
          archive = Path(os.environ["RUNNER_TEMP"]) / "r-4.5.2.deb"
          def run(command):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("R installation exceeded its deadline")
              subprocess.run(command, check=True, timeout=remaining)
          run(["curl", "--fail", "--location", "--retry", "1", "--connect-timeout", "10",
               "--max-time", "90", "--output", str(archive), url])
          packages = Path(os.environ["RUNNER_TEMP"]) / "r-runtime-deps"
          packages.mkdir(exist_ok=True)
          sources = Path(os.environ["RUNNER_TEMP"]) / "r-runtime-sources.list"
          codename = release["VERSION_CODENAME"]
          sources.write_text(
              f"deb https://archive.ubuntu.com/ubuntu {codename} main universe\n"
              f"deb https://archive.ubuntu.com/ubuntu {codename}-updates main universe\n"
              f"deb https://security.ubuntu.com/ubuntu {codename}-security main universe\n")
          apt = ["sudo", "env", "DEBIAN_FRONTEND=noninteractive", "apt-get",
                 "-o", "Dir::Etc::sourcelist=" + str(sources), "-o", "Dir::Etc::sourceparts=-",
                 "-o", "APT::Get::List-Cleanup=0", "-o", "Dir::Cache::archives=" + str(packages),
                 "-o", "APT::Keep-Downloaded-Packages=true",
                 "-o", "Binary::apt::APT::Keep-Downloaded-Packages=true",
                 "-o", "Acquire::Retries=1", "-o", "Acquire::http::Timeout=20",
                 "-o", "Acquire::https::Timeout=20"]
          run(apt + ["update"])
          run(apt + ["install", "--yes", "--no-install-recommends", str(archive)])
          run(["/opt/R/4.5.2/bin/Rscript", "--vanilla", "-e",
               'stopifnot(getRversion() == "4.5.2"); library(stats); cat(R.version.string, "\\n")'])
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write("/opt/R/4.5.2/bin\n")
          PY
      - name: Set up R 4.5.2 environment
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        if: contains(env.SOFTWARE, 'acousticts')
        timeout-minutes: 5
        with:
          r-version: '4.5.2'
          install-r: ${{ runner.os != 'Linux' }}
          use-public-rspm: true
      - name: Verify requested R runtime
        if: contains(env.SOFTWARE, 'acousticts')
        timeout-minutes: 1
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() == "4.5.2")
          library(stats)
          cat(R.version.string, "\n")
      - name: Save Linux R immediately
        if: runner.os == 'Linux' && contains(env.SOFTWARE, 'acousticts') && steps.r-runtime-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            /opt/R/4.5.2
            ${{ runner.temp }}/r-runtime-deps/*.deb
          key: ${{ steps.r-runtime-cache.outputs.cache-primary-key }}
      - name: Configure native macOS GNU compilers and SDK
        if: runner.os == 'macOS'
        timeout-minutes: 3
        shell: bash
        run: |
          arguments=(configure --directory "$RUNNER_TEMP/benchmark-env")
          if [[ "$SOFTWARE" == *acousticts* ]]; then arguments+=(--with-r); fi
          python "$MACOS_SETUP_SCRIPT" "${arguments[@]}"
      - name: Restore R package library
        if: contains(env.SOFTWARE, 'acousticts')
        id: r-library-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.temp }}/benchmark-env/r-library
          key: ${{ runner.os == 'macOS' && format('r-library-macos-gnu-v1-{0}-{1}-4.5.2-{2}-{3}', steps.r-cache-platform.outputs.image, runner.arch, env.MACOS_TOOLCHAIN_KEY, hashFiles('src/setup_r.R', 'sources.lock.json')) || format('r-library-v1-{0}-{1}-4.5.2-{2}', steps.r-cache-platform.outputs.image, runner.arch, hashFiles('src/setup_r.R', 'sources.lock.json', '.github/workflows/benchmark.yml')) }}
          restore-keys: ${{ runner.os == 'macOS' && format('r-library-macos-gnu-v1-{0}-{1}-4.5.2-{2}-', steps.r-cache-platform.outputs.image, runner.arch, env.MACOS_TOOLCHAIN_KEY) || format('r-library-v1-{0}-{1}-4.5.2-', steps.r-cache-platform.outputs.image, runner.arch) }}
