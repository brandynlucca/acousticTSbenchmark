name: Cached numerical references
run-name: Cached numerical references (${{ inputs.profile }})
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: pilot
      budget_minutes:
        type: number
        default: 15
      case_limit:
        type: number
        default: 0
      timing_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      profile:
        description: Reference case matrix
        type: choice
        options: [pilot, full]
        default: pilot
      budget_minutes:
        description: Calculation minutes per runner (two parallel runners)
        type: number
        default: 15
      case_limit:
        description: Maximum missing cases per runner, or 0 for the time budget
        type: number
        default: 0
      timing_run_id:
        description: Optional completed timing run to refresh with these references
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  reference:
    name: references (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: numerical-reference-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PROFILE: ${{ inputs.profile }}
      SHARD: ${{ matrix.shard }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate compute limits
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          python - <<'PY'
          import os
          budget = float(os.environ['BUDGET_MINUTES'])
          limit = int(os.environ['CASE_LIMIT'])
          if not budget.is_integer() or not 10 <= budget <= 30 or limit < 0:
              raise SystemExit('Reference budget must be 10–30 minutes and case_limit nonnegative')
          PY
      - name: Restore qualified references before installing Julia
        id: restore
        run: python src/reference_store.py restore --profile "$PROFILE" --shard-index "$SHARD" --shard-count 2 --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json"
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        if: steps.restore.outputs.missing != '0'
        timeout-minutes: 5
        with:
          version: '1.12.1'
      - name: Restore Julia dependencies
        if: steps.restore.outputs.missing != '0'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
          key: reference-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json', 'src/setup_julia.jl') }}
      - name: Prepare AcousticScattering only
        if: steps.restore.outputs.missing != '0'
        timeout-minutes: 8
        run: python src/prepare.py --directory "$RUNNER_TEMP/reference-env" --software acousticscattering
      - name: Calculate missing references in one persistent Julia process
        if: steps.restore.outputs.missing != '0'
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          arguments=(src/references.py --profile "$PROFILE" --runtime "$RUNNER_TEMP/reference-env/runtime.json" --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json" --threads 4 --shard-index "$SHARD" --shard-count 2 --budget-seconds "$((BUDGET_MINUTES * 60))" --case-timeout-seconds 600)
          if [[ "$CASE_LIMIT" != '0' ]]; then arguments+=(--case-limit "$CASE_LIMIT"); fi
          python "${arguments[@]}"
      - name: Persist successful references even after partial failure
        if: always() && steps.restore.outcome == 'success'
        run: python src/reference_store.py publish --profile "$PROFILE" --shard-index "$SHARD" --shard-count 2 --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json"
      - name: Reference data and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: references-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-results/
            ${{ runner.temp }}/reference-env/runtime.json
            ${{ runner.temp }}/reference-env/julia/Manifest.toml
          if-no-files-found: warn
          retention-days: 90
  attach:
    if: always() && inputs.timing_run_id != ''
    needs: reference
    uses: ./.github/workflows/attach-references.yml
    with:
      run_id: ${{ inputs.timing_run_id }}
