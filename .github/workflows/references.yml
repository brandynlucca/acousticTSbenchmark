name: Cached numerical references
run-name: ${{ inputs.timing_run_id != '' && format('References for benchmark {0}', inputs.timing_run_id) || format('Cached numerical references ({0})', inputs.profile) }}
on:
  workflow_call:
    inputs:
      profile:
        type: string
        default: pilot
      configuration_json:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''
      budget_minutes:
        type: number
        default: 15
      case_limit:
        type: number
        default: 0
      timing_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      profile:
        description: Reference case matrix
        type: choice
        options: [pilot, full]
        default: pilot
      budget_minutes:
        description: Calculation minutes per runner (two parallel runners)
        type: number
        default: 15
      case_limit:
        description: Maximum missing cases per runner, or 0 for the time budget
        type: number
        default: 0
      timing_run_id:
        description: Optional active or completed timing run to supply with references
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
      configuration: ${{ steps.resolve.outputs.configuration }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Resolve reference campaign
        id: resolve
        env:
          CONFIGURATION_JSON: ${{ inputs.configuration_json }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          PROFILE: ${{ inputs.profile }}
          TIMING_RUN_ID: ${{ inputs.timing_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'src')
          from benchmark import read_json
          from campaign import reference_campaign
          if os.environ['CONFIGURATION_JSON']:
              settings = dict(configuration=json.loads(os.environ['CONFIGURATION_JSON']),
                              profile=os.environ['PROFILE'], source_ref=os.environ['SOURCE_REF'])
          elif os.environ['TIMING_RUN_ID']:
              settings = reference_campaign(os.environ['TIMING_RUN_ID'], os.environ['GITHUB_REPOSITORY'])
          else:
              settings = dict(configuration=read_json('benchmark.json'),
                              profile=os.environ['PROFILE'], source_ref=os.environ['SOURCE_REF'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key in ('profile', 'source_ref', 'configuration'):
                  value = settings[key]
                  output.write(key + '=' + (json.dumps(value, separators=(',', ':')) if isinstance(value, dict) else value) + '\n')
          PY
  reference:
    name: references (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: configuration
    timeout-minutes: 140
    concurrency:
      group: numerical-reference-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PROFILE: ${{ needs.configuration.outputs.profile }}
      SHARD: ${{ matrix.shard }}
      GITHUB_TOKEN: ${{ github.token }}
      REFERENCE_TIMING_RUN_ID: ${{ inputs.timing_run_id || github.run_id }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JULIA_NUM_THREADS: '4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Preserve reference publication controllers
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'reference-controller'
          directory.mkdir(exist_ok=True)
          for name in ('reference_store.py', 'reference_curves.py', 'publish_progress.py'):
              shutil.copyfile(Path('src') / name, directory / name)
          controller = directory / 'reference_store.py'
          source = controller.read_text(encoding='utf-8')
          future = 'from __future__ import annotations\n'
          if future not in source:
              raise SystemExit('Reference controller lacks its expected import boundary')
          bootstrap = "import sys\nfrom pathlib import Path\nsys.path.insert(1, str(Path.cwd() / 'src'))\n"
          controller.write_text(source.replace(future, future + bootstrap, 1), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'REFERENCE_STORE_CONTROLLER={controller}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.configuration.outputs.source_ref }}
      - name: Write reference configuration
        env:
          CONFIGURATION_JSON: ${{ needs.configuration.outputs.configuration }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'reference-config.json'
          path.write_text(json.dumps(json.loads(os.environ['CONFIGURATION_JSON']), indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'BENCHMARK_CONFIG={path}\n')
          PY
      - name: Validate compute limits
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          python - <<'PY'
          import os
          budget = float(os.environ['BUDGET_MINUTES'])
          limit = int(os.environ['CASE_LIMIT'])
          if not budget.is_integer() or not 10 <= budget <= 120 or limit < 0:
              raise SystemExit('Reference budget must be 10 to 120 minutes and case_limit nonnegative')
          PY
      - name: Restore qualified references before installing Julia
        id: restore
        run: python "$REFERENCE_STORE_CONTROLLER" restore --config "$BENCHMARK_CONFIG" --profile "$PROFILE" --shard-index "$SHARD" --shard-count 2 --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json"
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
        if: steps.restore.outputs.missing != '0'
        timeout-minutes: 5
        with:
          version: '1.12.1'
      - name: Restore Julia dependencies
        if: steps.restore.outputs.missing != '0'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
            ~/.julia/registries
          key: reference-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json', 'src/setup_julia.jl') }}
      - name: Prepare AcousticScattering only
        if: steps.restore.outputs.missing != '0'
        timeout-minutes: 8
        run: python src/prepare.py --directory "$RUNNER_TEMP/reference-env" --software acousticscattering
      - name: Calculate missing references in one persistent Julia process
        if: steps.restore.outputs.missing != '0'
        env:
          BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          CASE_LIMIT: ${{ inputs.case_limit }}
        run: |
          arguments=(--config "$BENCHMARK_CONFIG" --profile "$PROFILE" --runtime "$RUNNER_TEMP/reference-env/runtime.json" --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json" --threads 4 --shard-index "$SHARD" --shard-count 2 --budget-seconds "$((BUDGET_MINUTES * 60))" --case-timeout-seconds 600)
          if [[ "$CASE_LIMIT" != '0' ]]; then arguments+=(--case-limit "$CASE_LIMIT"); fi
          python - "${arguments[@]}" <<'REFERENCE_QUEUE'
          import os, subprocess, sys, threading
          from pathlib import Path
          sys.path.insert(0, 'src')
          import references

          original_reference_jobs = references.reference_jobs

          def focused_reference_jobs(*args, **kwargs):
              jobs = original_reference_jobs(*args, **kwargs)
              return sorted(jobs, key=lambda job: (job['aspect_ratio'], job['boundary'],
                                                   job['incidence_deg'], job['frequency_hz']))

          def publish_periodically(stopped):
              temporary = Path(os.environ['RUNNER_TEMP'])
              command = [sys.executable, os.environ['REFERENCE_STORE_CONTROLLER'], 'publish',
                         '--config', os.environ['BENCHMARK_CONFIG'], '--profile', os.environ['PROFILE'],
                         '--shard-index', os.environ['SHARD'], '--shard-count', '2',
                         '--cache-dir', str(temporary / 'reference-cache'),
                         '--output', str(temporary / 'reference-results/published-references.json')]
              while not stopped.wait(60):
                  try:
                      subprocess.run(command, check=True, timeout=90)
                  except Exception as error:
                      print(f'Periodic reference publication deferred ({type(error).__name__})',
                            file=sys.stderr, flush=True)

          if __name__ == '__main__':
              # Scheduling stays outside the pinned numerical source so prior
              # campaigns retain their reference identities and reusable cache.
              references.reference_jobs = focused_reference_jobs
              stopped = threading.Event()
              publisher = threading.Thread(target=publish_periodically, args=(stopped,), daemon=True)
              publisher.start()
              try:
                  result = references.run(references.parser().parse_args())
              finally:
                  stopped.set()
                  publisher.join(timeout=95)
              raise SystemExit(result)
          REFERENCE_QUEUE
      - name: Persist successful references even after partial failure
        if: always() && steps.restore.outcome == 'success'
        run: python "$REFERENCE_STORE_CONTROLLER" publish --config "$BENCHMARK_CONFIG" --profile "$PROFILE" --shard-index "$SHARD" --shard-count 2 --cache-dir "$RUNNER_TEMP/reference-cache" --output "$RUNNER_TEMP/reference-results/references.json"
      - name: Reference data and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: references-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-results/
            ${{ runner.temp }}/reference-env/runtime.json
            ${{ runner.temp }}/reference-env/julia/Manifest.toml
          if-no-files-found: warn
          retention-days: 90
  attach:
    if: always() && inputs.timing_run_id != ''
    needs: reference
    uses: ./.github/workflows/attach-references.yml
    with:
      run_id: ${{ inputs.timing_run_id }}
