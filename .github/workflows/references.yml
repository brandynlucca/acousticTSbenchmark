name: Reference Fourier-group pilot
run-name: 'Reference full-frequency distribution: adaptive qualification'
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  JULIA_NUM_THREADS: '4'
  PYTHONDONTWRITEBYTECODE: '1'
  ACTIONS_CACHE_SERVICE_V2: 'true'
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
jobs:
  group:
    name: '${{ matrix.role }}: 299 kHz coupled FEM-BEM'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role:
        - coordinator
        - worker1
        - worker2
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Record runner start and pin active queue source
      run: python src/reference_group_probe.py pin
    - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
      with:
        version: 1.12.1
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: '~/.julia/artifacts

          ~/.julia/packages

          ~/.julia/registries'
        key: reference-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json',
          'src/setup_julia.jl') }}
        restore-keys: reference-deps-Linux-X64-
    - name: Prepare pinned numerical environment
      timeout-minutes: 10
      run: 'python -m pip install psutil==7.2.2

        python src/prepare.py --directory "$RUNNER_TEMP/reference-env" --software
        acousticscattering

        npm install --prefix "$RUNNER_TEMP" --no-audit --no-fund @actions/cache@4.0.0'
    - name: Complete adaptive frequency through shared worker jobs
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      timeout-minutes: 37
      with:
        script: await exec.exec('python', ['src/reference_group_probe.py', 'compute',
          '--role', process.env.GROUP_ROLE, '--full']);
    - name: Retain numerical traces and timing evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: reference-full-${{ matrix.role }}
        path: '${{ runner.temp }}/reference-full-*.json

          ${{ runner.temp }}/reference-full-*.log'
        if-no-files-found: error
        retention-days: 14
    env:
      GROUP_ROLE: ${{ matrix.role }}
  compare:
    name: Combined full-frequency qualification and elapsed time
    runs-on: ubuntu-24.04
    needs: group
    if: always()
    timeout-minutes: 5
    steps:
    - *id001
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: reference-full-*
        path: ${{ runner.temp }}/reference-group-results
        merge-multiple: true
    - name: Compare every trace and account for runner overhead
      run: python src/reference_group_probe.py compare-full --directory "$RUNNER_TEMP/reference-group-results"
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: reference-full-comparison
        path: '${{ runner.temp }}/reference-group-results/reference-full-comparison.json

          ${{ runner.temp }}/reference-group-results/reference-full-comparison.md'
        if-no-files-found: warn
        retention-days: 14
