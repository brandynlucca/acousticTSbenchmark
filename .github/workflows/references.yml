name: Reference Fourier-group pilot
run-name: 'Reference group distribution: bounded accuracy and elapsed-time pilot'
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  JULIA_NUM_THREADS: '4'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  group:
    name: '${{ matrix.role }}: 299 kHz coupled FEM-BEM'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        role:
        - baseline
        - worker1
        - worker2
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Record runner start and pin active queue source
      run: python src/reference_group_probe.py pin
    - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687
      with:
        version: 1.12.1
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: '~/.julia/artifacts

          ~/.julia/packages

          ~/.julia/registries'
        key: reference-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources.lock.json',
          'src/setup_julia.jl') }}
        restore-keys: reference-deps-Linux-X64-
    - name: Prepare pinned numerical environment
      timeout-minutes: 10
      run: 'python -m pip install psutil==7.2.2

        python src/prepare.py --directory "$RUNNER_TEMP/reference-env" --software
        acousticscattering'
    - name: Measure unchanged Fourier refinement requests
      timeout-minutes: 15
      run: python src/reference_group_probe.py compute --role "${{ matrix.role }}"
    - name: Retain numerical traces and timing evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: reference-groups-${{ matrix.role }}
        path: '${{ runner.temp }}/reference-group-*.json

          ${{ runner.temp }}/reference-group-*.log'
        if-no-files-found: error
        retention-days: 14
  compare:
    name: Combined accuracy, elapsed time and memory report
    runs-on: ubuntu-24.04
    needs: group
    if: always()
    timeout-minutes: 5
    steps:
    - *id001
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: reference-groups-*
        path: ${{ runner.temp }}/reference-group-results
        merge-multiple: true
    - name: Compare every trace and account for runner overhead
      run: python src/reference_group_probe.py compare --directory "$RUNNER_TEMP/reference-group-results"
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: reference-group-comparison
        path: '${{ runner.temp }}/reference-group-results/reference-group-comparison.json

          ${{ runner.temp }}/reference-group-results/reference-group-comparison.md'
        if-no-files-found: warn
        retention-days: 14
